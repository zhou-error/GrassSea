# GrassSea 排版模板（可自行修改，无需重启）
#
# 查找顺序：
#   1. <DATA_DIR>/templates/report.yaml     用户覆盖（默认 <项目根>/data/templates/）
#   2. <项目根>/templates/report.yaml       仓库默认（本文件）
#
# 修改任一处后，下次生成文档时自动生效。
# 单位：字号=磅(pt)，页边距=厘米(cm)，行距=倍数，缩进=字符数。

page:
  margin_cm:
    top: 2.54
    bottom: 2.54
    left: 3.17
    right: 3.17

body:
  font: 宋体
  font_size: 12
  line_spacing: 1.5
  first_line_indent_chars: 2

heading:
  "1":
    font: 黑体
    font_size: 16
    space_before: 12
    space_after: 6
  "2":
    font: 黑体
    font_size: 14
    space_before: 8
    space_after: 4
  "3":
    font: 黑体
    font_size: 12.5
    space_before: 6
    space_after: 3
  "4":
    font: 黑体
    font_size: 12
    space_before: 4
    space_after: 2

cover:
  font: 黑体
  title_size: 26
  subtitle_size: 16
  field_size: 14
