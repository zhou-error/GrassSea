[project]
name = "grasssea"
version = "0.1.0"
description = "白草沧智（GrassSea AI）— 面向船舶与海洋工程领域的 AI 原生多智能体协作平台"
requires-python = ">=3.11"
authors = [
    { name = "GrassSea AI Team" }
]
readme = "README.md"
license = { text = "MIT" }

dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.27.0",
    "httpx>=0.27.0",
    "sqlalchemy[asyncio]>=2.0.25",
    "asyncpg>=0.29.0",
    "alembic>=1.13.0",
    "motor>=3.3.0",
    "redis>=5.0.0",
    "pymilvus>=2.4.0",
    "celery>=5.3.0",
    "pydantic>=2.6.0",
    "pydantic-settings>=2.1.0",
    "python-jose[cryptography]>=3.3.0",
    "passlib[bcrypt]>=1.7.4",
    "python-multipart>=0.0.6",
    "websockets>=12.0",
    "aio-pika>=9.3.0",
    "boto3>=1.34.0",
    "pypdf2>=3.0.0",
    "pymupdf>=1.23.0",
    "unstructured>=0.12.0",
    "langchain>=0.1.0",
    "langchain-community>=0.0.20",
    "openai>=1.12.0",
    "tiktoken>=0.5.0",
    "numpy>=1.26.0",
    "pandas>=2.2.0",
    "openpyxl>=3.1.0",
    "python-dotenv>=1.0.0",
    "structlog>=24.0.0",
    "tenacity>=8.2.0",
    "transitions>=0.9.0",
    "neo4j>=5.14.0",
    "minio>=7.2.0",
    "opentelemetry-api>=1.22.0",
    "opentelemetry-sdk>=1.22.0",
    "opentelemetry-instrumentation-fastapi>=0.43b0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=4.1.0",
    "httpx-sse>=0.4.0",
    "ruff>=0.2.0",
    "mypy>=1.8.0",
    "bandit>=1.7.0",
    "pre-commit>=3.6.0",
]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-v --cov=shared --cov=services --cov=agents --cov=tools --cov-report=term-missing"

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true

[tool.alembic]
script_location = "shared/models/alembic"
sqlalchemy.url = "postgresql+asyncpg://grasssea:grasssea@localhost:5432/grasssea"

[tool.setuptools.packages.find]
where = ["."]
include = ["shared*", "services*", "agents*", "tools*", "scripts*"]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"