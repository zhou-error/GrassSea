# ============================================================
# GrassSea AI — K3s ConfigMap (非敏感配置)
# ============================================================
apiVersion: v1
kind: ConfigMap
metadata:
  name: grasssea-config
  namespace: grasssea
data:
  APP_NAME: "GrassSea"
  APP_ENV: "production"
  APP_DEBUG: "false"
  POSTGRES_HOST: "postgres.grasssea.svc.cluster.local"
  POSTGRES_PORT: "5432"
  POSTGRES_DB: "grasssea"
  MONGODB_HOST: "mongodb.grasssea.svc.cluster.local"
  MONGODB_PORT: "27017"
  MONGODB_DB: "grasssea"
  REDIS_HOST: "redis.grasssea.svc.cluster.local"
  REDIS_PORT: "6379"
  MILVUS_HOST: "milvus.grasssea.svc.cluster.local"
  MILVUS_PORT: "19530"
  MINIO_HOST: "minio.grasssea.svc.cluster.local"
  MINIO_PORT: "9000"
  MINIO_BUCKET: "grasssea-files"
  RABBITMQ_HOST: "rabbitmq.grasssea.svc.cluster.local"
  RABBITMQ_PORT: "5672"
  CELERY_BROKER_URL: "amqp://grasssea:grasssea@rabbitmq.grasssea.svc.cluster.local:5672/"
  CELERY_RESULT_BACKEND: "redis://redis.grasssea.svc.cluster.local:6379/1"
  EMBEDDING_MODEL: "text-embedding-3-large"
  EMBEDDING_DIM: "3072"
