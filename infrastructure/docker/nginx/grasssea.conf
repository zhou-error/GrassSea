# GrassSea AI — Nginx 生产配置
server {
    listen 443 ssl http2;
    server_name grasssea.local;

    ssl_certificate /etc/nginx/certs/grasssea.crt;
    ssl_certificate_key /etc/nginx/certs/grasssea.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    client_max_body_size 100m;

    # 前端 SPA
    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    # API
    location /api/ {
        proxy_pass http://agent-service.grasssea.svc.cluster.local:8002/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # WebSocket
    location /ws/ {
        proxy_pass http://agent-service.grasssea.svc.cluster.local:8002/ws/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 3600s;
    }

    # 模型网关
    location /v1/ {
        proxy_pass http://model-gateway.grasssea.svc.cluster.local:8004/;
        proxy_read_timeout 300s;
    }
}

server {
    listen 80;
    server_name grasssea.local;
    return 301 https://$host$request_uri;
}
