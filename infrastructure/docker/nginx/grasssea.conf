# ============================================================
# GrassSea AI — Nginx 配置 (Docker 内部网络)
# 前端容器通过此配置反向代理到各后端服务
# ============================================================

# Docker 内嵌 DNS，使用变量 proxy_pass 实现动态解析
# 避免容器重建后 IP 变化导致 502
resolver 127.0.0.11 valid=10s ipv6=off;

server {
    listen 80;
    server_name _;

    # 上传文件大小限制
    client_max_body_size 100m;

    # gzip 压缩
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript image/svg+xml;
    gzip_min_length 1000;

    # ======== 前端 SPA ========
    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    # ======== API (→ chat_service 作为网关) ========
    # 使用正则捕获路径，配合变量 proxy_pass 实现 DNS 动态解析
    location ~ ^/api/(.*)$ {
        set $chat_upstream chat-service:8001;
        proxy_pass http://$chat_upstream/$1$is_args$args;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
    }

    # ======== WebSocket (流式对话) ========
    location ~ ^/ws/(.*)$ {
        set $chat_upstream chat-service:8001;
        proxy_pass http://$chat_upstream/ws/$1$is_args$args;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 3600s;
    }

    # ======== 模型网关 (LLM API) ========
    # model-gateway 的端点是 /v1/chat/completions，保留完整路径
    location ~ ^/v1/(.*)$ {
        set $model_upstream model-gateway:8004;
        proxy_pass http://$model_upstream/v1/$1$is_args$args;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 300s;
    }
}
