name: CI/CD

on:
  push:
    branches: [master, develop]
  pull_request:
    branches: [master]

env:
  REGISTRY: harbor.grasssea.local
  IMAGE_PREFIX: grasssea

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: timescale/timescaledb:2.14.2-pg15
        env: { POSTGRES_USER: grasssea, POSTGRES_PASSWORD: grasssea, POSTGRES_DB: grasssea }
        ports: ["5432:5432"]
      redis:
        image: redis:7.2-alpine
        ports: ["6379:6379"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - name: Install
        run: pip install -e ".[dev]"
      - name: Lint
        run: ruff check .
      - name: Type check
        run: mypy shared/ services/ agents/ tools/ --ignore-missing-imports
      - name: Test
        run: pytest tests/ -v --cov --cov-report=xml
        env:
          POSTGRES_HOST: localhost
          DEEPSEEK_API_KEY: test-key

  build:
    needs: test
    if: github.ref == 'refs/heads/master' || github.ref == 'refs/heads/develop'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [model-gateway, chat-service, agent-service, knowledge-service]
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: |
          docker build -f infrastructure/docker/Dockerfile -t $REGISTRY/$IMAGE_PREFIX/${{ matrix.service }}:${{ github.sha }} .
      - name: Push image
        run: |
          echo "${{ secrets.HARBOR_PASSWORD }}" | docker login $REGISTRY -u ${{ secrets.HARBOR_USER }} --password-stdin
          docker push $REGISTRY/$IMAGE_PREFIX/${{ matrix.service }}:${{ github.sha }}

  deploy:
    needs: build
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Deploy to K3s
        run: |
          mkdir -p ~/.kube
          echo "${{ secrets.KUBECONFIG }}" | base64 -d > ~/.kube/config
          for svc in model-gateway chat-service agent-service knowledge-service; do
            kubectl set image deployment/$svc $svc=$REGISTRY/$IMAGE_PREFIX/$svc:${{ github.sha }} -n grasssea
          done
          kubectl rollout status deployment -n grasssea
