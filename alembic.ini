# Alembic configuration - GrassSea AI
# Run from the project root: alembic upgrade head
# The database URL is supplied by shared/models/alembic/env.py from .env;
# it is intentionally left empty here to avoid maintaining it twice.
# Keep this file ASCII-only: Alembic reads it with the system locale encoding.

[alembic]
script_location = %(here)s/shared/models/alembic
prepend_sys_path = .
sqlalchemy.url =

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
